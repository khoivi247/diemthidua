<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi đua</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1 class="typing" id="title">Thi đua</h1>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="school">Toàn trường</button>
        <button class="tab hidden" data-tab="myclass" id="tabMyClass">Lớp</button>
      </nav>
    </div>
    <button class="admin-btn" id="adminBtn">Đăng nhập admin</button>
  </header>

  <!-- ============ TAB TOÀN TRƯỜNG ============ -->
  <section class="panel active" id="panel-school">

    <div class="week-bar">
      <label>Tuần:</label>
      <select id="weekSelect"></select>
      <span class="week-range" id="weekRange"></span>
      <div class="export-group">
        <button class="ghost-btn" id="btnCsv">Xuất CSV</button>
        <button class="ghost-btn" id="btnPdf">Xuất PDF</button>
      </div>
    </div>

    <div class="podium" id="podium"></div>

    <div class="chart-wrap" id="chartWrap">
      <div class="chart-header">
        <span>So sánh điểm thi đua các lớp</span>
      </div>
      <div class="chart-body">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div class="list" id="list"></div>

    <form class="add-form" id="addFormSchool">
      <div class="form-row">
        <input id="fsWeek" placeholder="Tuần" type="number" required>
        <input id="fsFrom" placeholder="Từ ngày" type="date" required>
        <input id="fsTo" placeholder="Đến ngày" type="date" required>
      </div>
      <div class="form-row">
        <input id="fsClass" placeholder="Lớp (VD: 10A1)" required>
        <input id="fsScore" placeholder="Điểm thi đua" type="number" step="0.01" required>
        <button class="primary" id="btnAddSchool" type="submit">Thêm</button>
      </div>
    </form>
  </section>

  <!-- ============ TAB LỚP T ============ -->
  <section class="panel" id="panel-myclass">

    <div class="week-bar">
      <label>Tuần:</label>
      <select id="myWeekSelect"></select>
      <span class="week-range" id="myWeekRange"></span>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label">Điểm SĐB</div>
        <div class="value" id="mySdb">—</div>
      </div>
      <div class="card">
        <div class="label">Cờ đỏ</div>
        <div class="value" id="myRed">—</div>
      </div>
      <div class="card">
        <div class="label">Tổng điểm</div>
        <div class="value total" id="myTotal">—</div>
      </div>
    </div>

    <div class="chart-wrap" id="myChartWrap">
      <div class="chart-header">
        <span>Điểm lớp 10A2 qua các tuần</span>
      </div>
      <div class="chart-body">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <div class="list" id="myList"></div>

    <!-- ✅ Form nhập liệu cho lớp t (chỉ hiện khi admin đăng nhập) -->
    <form class="add-form" id="addFormMy">
      <div class="form-row">
        <input id="fmWeek" placeholder="Tuần" type="number" required>
        <input id="fmFrom" placeholder="Từ ngày" type="date" required>
        <input id="fmTo" placeholder="Đến ngày" type="date" required>
      </div>
      <div class="form-row">
        <input id="fmGood" placeholder="Giờ tốt" type="number" required>
        <input id="fmFair" placeholder="Giờ khá" type="number" required>
        <input id="fmTotal" placeholder="Tổng tiết" type="number" required>
        <input id="fmRed" placeholder="Cờ đỏ" type="number" step="0.01" required>
        <button class="primary" id="btnAddMy" type="submit">Thêm</button>
      </div>
    </form>
  </section>

  <div class="status" id="status"></div>
</div>

<!-- Modal login -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Đăng nhập admin</h2>
    <p>Nhập mật khẩu để chỉnh sửa số liệu.</p>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password">
    <div class="modal-actions">
      <button class="cancel" id="btnCancel" type="button">Hủy</button>
      <button class="primary" id="btnLogin" type="button">Đăng nhập</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
